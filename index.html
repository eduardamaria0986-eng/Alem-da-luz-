
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Além da Luz</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111111;
      color: #eee5d5;
      font-family: Georgia, serif;
    }
    header {
      text-align: center;
      padding: 38px 15px;
      border-bottom: 1px solid #aa8b55;
    }
    header h1 {
      color: #d6b77d;
      letter-spacing: 5px;
      font-size: 34px;
      margin: 0;
    }
    header p {
      color: #bba77f;
      letter-spacing: 3px;
      font-size: 11px;
    }
    main {
      max-width: 600px;
      margin: auto;
      padding: 22px;
    }
    .card {
      background: #201e1a;
      border: 1px solid #806b48;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h2 {
      color: #d6b77d;
      font-size: 19px;
    }
    .item {
      padding: 13px;
      margin: 9px 0;
      background: #2b2822;
      border-radius: 8px;
      color: #eee5d5;
    }
    footer {
      text-align: center;
      color: #9c8968;
      padding: 25px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>ALÉM DA LUZ</h1>
    <p>SUA HISTÓRIA COMEÇA AQUI</p>
  </header>

  <main>
    <section class="card">
      <h2>Bem-vindo ao universo</h2>
      <p>Entre em um mundo de histórias,
      escolhas e personagens.</p>
    </section>

    <section class="card">
      <h2>Central dos jogadores</h2>
      <div class="item">✦ Personagens</div>
      <div class="item">✦ Fichas individuais</div>
      <div class="item">✦ Habilidades e perícias</div>
      <div class="item">✦ Inventário e equipamentos</div>
      <div class="item">✦ Painel do mestre</div>
    </section>
  </main>

  <footer>
    ALÉM DA LUZ • SISTEMA DE RPG
  </footer>
</body>
</html>
